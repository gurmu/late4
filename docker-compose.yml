# App Service compatible compose file.
# Removed: ports, networks, restart  — App Service ignores / does not support them.
# App Service routes external traffic to teams-bot via WEBSITES_PORT=3978.
# Internal traffic uses service-name DNS: http://ivanti-api:8000, http://nice-api:8001.

services:
  teams-bot:
    image: ${ACR_LOGIN_SERVER}/teams-bot:${IMAGE_TAG:-latest}
    environment:
      PORT: ${WEBSITES_PORT:-3978}
      AZURE_AUTHORITY_HOST: ${AZURE_AUTHORITY_HOST}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
      AZURE_SEARCH_INDEX: ${AZURE_SEARCH_INDEX}
      AZURE_SEARCH_KEY: ${AZURE_SEARCH_KEY}
      AZURE_VISION_ENDPOINT: ${AZURE_VISION_ENDPOINT}
      AZURE_VISION_KEY: ${AZURE_VISION_KEY}
      KB_TOP_K: ${KB_TOP_K}
      KB_CONTENT_FIELD: ${KB_CONTENT_FIELD}
      KB_SEMANTIC_CONFIG: ${KB_SEMANTIC_CONFIG}
      COSMOSDB_ENDPOINT: ${COSMOSDB_ENDPOINT}
      COSMOSDB_KEY: ${COSMOSDB_KEY}
      COSMOSDB_DATABASE: ${COSMOSDB_DATABASE}
      COSMOSDB_CONTAINER: ${COSMOSDB_CONTAINER}
      MICROSOFT_APP_ID: ${MICROSOFT_APP_ID}
      MICROSOFT_APP_PASSWORD: ${MICROSOFT_APP_PASSWORD}
      BOT_TYPE: ${BOT_TYPE}
      APP_MSI_RESOURCE_ID: ${APP_MSI_RESOURCE_ID}
      BOT_FRAMEWORK_CHANNEL_SERVICE: ${BOT_FRAMEWORK_CHANNEL_SERVICE}
      BOT_FRAMEWORK_OAUTH_URL: ${BOT_FRAMEWORK_OAUTH_URL}
      IVANTI_API_URL: ${IVANTI_API_URL}
      NICE_API_URL: ${NICE_API_URL}

  ivanti-api:
    image: ${ACR_LOGIN_SERVER}/ivanti-api:${IMAGE_TAG:-latest}
    environment:
      PORT: "8000"
      IVANTI_BASE_URL: ${IVANTI_BASE_URL}
      IVANTI_API_KEY: ${IVANTI_API_KEY}

  nice-api:
    image: ${ACR_LOGIN_SERVER}/nice-api:${IMAGE_TAG:-latest}
    environment:
      PORT: "8001"
      BASE_URL: ${NICE_BASE_URL}
      ACCESS_KEY_ID: ${NICE_ACCESS_KEY_ID}
      ACCESS_KEY_SECRET: ${NICE_ACCESS_KEY_SECRET}
